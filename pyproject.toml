[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changelog-skill"
version = "0.1.0"
description = "Generate a Markdown CHANGELOG from Conventional Commits, with no runtime dependencies."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "claude-builders-bounty contributors" }]
keywords = ["changelog", "conventional-commits", "git", "cli", "release-notes"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tim777z/claude-builders-bounty"
Repository = "https://github.com/tim777z/claude-builders-bounty"
Issues = "https://github.com/tim777z/claude-builders-bounty/issues"
Security = "https://github.com/tim777z/claude-builders-bounty/blob/main/SECURITY.md"
Changelog = "https://github.com/tim777z/claude-builders-bounty/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["ruff==0.7.4", "coverage==7.16.1", "pip-audit==2.7.3", "mypy==2.3.1"]

[project.scripts]
changelog-skill = "changelog_skill.cli:main"

[tool.setuptools.packages.find]
include = ["changelog_skill*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
changelog_skill = ["py.typed"]

# Explicit test discovery so local runners and static scanners can find the
# unittest suite without guessing a command.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["changelog_skill"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

# Static type checking is part of the shipping gate: the package advertises
# py.typed, so a type regression is a breaking change for downstream users.
[tool.mypy]
files = ["changelog_skill"]
python_version = "3.11"
strict = true
pretty = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  # Long messages give operators actionable, structured errors.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["changelog_skill"]
