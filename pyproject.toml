[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changelog-skill"
version = "0.1.0"
description = "Generate a Markdown CHANGELOG from Conventional Commits, with no runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "claude-builders-bounty contributors" }]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
dev = ["ruff==0.7.4"]

[project.scripts]
changelog-skill = "changelog_skill.cli:main"

[tool.setuptools.packages.find]
include = ["changelog_skill*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  # Long messages give operators actionable, structured errors.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["changelog_skill"]
