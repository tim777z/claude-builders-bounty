name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the checked-out source.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format, test, audit and smoke-test the CLI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Verify the full range declared by requires-python = ">=3.10".
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        # Pinned to an immutable commit for supply-chain safety (actions/checkout v4).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        # Pinned to an immutable commit for supply-chain safety (actions/setup-python v5).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned tooling and the package
        # Install from the hashed lockfile so CI and local clones resolve an
        # identical, integrity-checked dependency set.
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m pip install --disable-pip-version-check -e .

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run unit tests with an enforced coverage floor
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --fail-under=85

      - name: Audit dependencies
        # Audits the exact hash-locked toolchain; the runtime package has none.
        run: python -m pip-audit -r requirements-dev.lock

      - name: Smoke-test the CLI against this repository's history
        run: python -m changelog_skill --repo . --skip-invalid --release-version 0.0.0 --release-date 1970-01-01 --output "$RUNNER_TEMP/CHANGELOG.smoke.md"
