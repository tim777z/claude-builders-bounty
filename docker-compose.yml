# One-command, isolated execution of the whole application.
# There are no databases or backing services: the CLI is the entire app, so a
# single hardened container is the complete stack. Mount a repository read-only
# and emit the CHANGELOG to stdout:
#
#   docker compose run --rm changelog
#
# RELEASE_VERSION / RELEASE_DATE may be overridden in the environment.
services:
  changelog:
    build:
      context: .
      dockerfile: Dockerfile
    image: changelog-skill:local
    # No network access is needed to parse local commit history.
    network_mode: none
    # Least privilege: read-only root filesystem, no capabilities, no escalation.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    volumes:
      - ./:/work:ro
    working_dir: /work
    command:
      - --repo
      - /work
      - --release-version
      - ${RELEASE_VERSION:-0.0.0}
      - --release-date
      - ${RELEASE_DATE:-1970-01-01}
