name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the checked-out source.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, format, test, audit and smoke-test the CLI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Verify the full range declared by requires-python = ">=3.11".
        # The hash-locked toolchain's advisory-free filelock 4.2.x requires
        # >=3.11; earlier 3.10-compatible releases have known advisories.
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        # Pinned to an immutable commit for supply-chain safety (actions/checkout v5, Node 24).
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Set up Python
        # Pinned to an immutable commit for supply-chain safety (actions/setup-python v6, Node 24).
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned tooling and the package
        # Install from the hashed lockfile so CI and local clones resolve an
        # identical, integrity-checked dependency set.
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m pip install --disable-pip-version-check -e .

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run unit tests with an enforced coverage floor
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --fail-under=85

      - name: Audit dependencies
        # Audits the exact hash-locked toolchain; the runtime package has none.
        # The `pip-audit` distribution exposes the importable module `pip_audit`
        # (underscore); the hyphenated name is not a valid Python `-m` target.
        run: python -m pip_audit -r requirements-dev.lock

      - name: Smoke-test the CLI against this repository's history
        run: python -m changelog_skill --repo . --skip-invalid --release-version 0.0.0 --release-date 1970-01-01 --output "$RUNNER_TEMP/CHANGELOG.smoke.md"
